name: Dashboard Upgrade

on:
  push:
    branches: [main]
    paths:
      - dashboard/upgrade-v13.flag

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic dashboard upgrade
        run: python dashboard/apply_upgrade_v13.py
      - name: Static guards
        run: |
          grep -q 'Workstation 1.3' dashboard/index.html
          grep -q 'DASH_SNAPSHOT_URL' dashboard/index.html
          grep -q 'HISTORICAL_SETUPS' dashboard/index.html
          grep -q 'hydrateProtocolSetups' dashboard/index.html
          grep -q 'THESIS_ID' dashboard/index.html
          grep -q 'Public derivatives overlay' dashboard/index.html
          ! grep -q 'src="/style.css"' dashboard/index.html
          ! grep -q 'src="/app.js"' dashboard/index.html
          python - <<'PY'
          import json
          d=json.load(open('dashboard/snapshot.json',encoding='utf-8'))
          assert d.get('meta',{}).get('dashboard_version') == 'Analyst Workstation 1.3'
          assert isinstance(d.get('current_theses'),list)
          PY
      - name: Commit reconciled dashboard artifacts
        run: |
          if git diff --quiet -- dashboard/index.html dashboard/snapshot.json; then
            echo 'No dashboard change required'
            exit 0
          fi
          git config user.name 'dashboard-upgrade-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add dashboard/index.html dashboard/snapshot.json
          git commit -m 'dashboard: reconcile workstation v1.3 renderer metadata'
          git push
