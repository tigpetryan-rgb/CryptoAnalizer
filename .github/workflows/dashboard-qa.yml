name: Dashboard QA

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'vercel.json'
      - '.github/workflows/dashboard-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'vercel.json'
      - '.github/workflows/dashboard-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contract and HTML guards
        run: python dashboard/qa.py
      - name: Inline JavaScript syntax
        run: node --check dashboard/.qa-inline.js
      - name: Vercel root delivery guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('vercel.json').read_text(encoding='utf-8'))
          rewrites=cfg.get('rewrites',[])
          assert {'source':'/','destination':'/dashboard/index.html'} in rewrites, 'root rewrite missing'
          headers=cfg.get('headers',[])
          roots=[h for h in headers if h.get('source') in {'/','/dashboard/index.html'}]
          assert len(roots)==2, 'expected no-store headers for root and index'
          for item in roots:
              values={x.get('key','').lower():x.get('value','') for x in item.get('headers',[])}
              assert 'cache-control' in values and 'no-store' in values['cache-control'].lower(), 'no-store cache guard missing'
          html=Path('dashboard/index.html').read_text(encoding='utf-8')
          assert 'DASH_EMBEDDED_SNAPSHOT' in html, 'embedded authoritative fallback missing'
          PY
